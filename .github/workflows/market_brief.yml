name: Market brief

on:
  schedule:
    # GitHub schedules are in UTC (Singapore = UTC+8) and are best-effort:
    # runs can start late or be skipped when GitHub is busy, especially near
    # the top of the hour. So each brief has two attempts, 30 minutes apart,
    # at quieter minutes. The guard step below skips the second attempt if
    # the first one already sent the brief.
    - cron: "41 0 * * *"    # 08:41 SGT  morning brief, 1st attempt
    - cron: "11 1 * * *"    # 09:11 SGT  morning brief, backup
    - cron: "41 12 * * *"   # 20:41 SGT  evening brief, 1st attempt
    - cron: "11 13 * * *"   # 21:11 SGT  evening brief, backup
  workflow_dispatch:         # adds a "Run workflow" button for manual tests

permissions:
  contents: read
  actions: read             # lets the guard step look at recent runs

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip if this brief was already sent
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-90 minutes' +%Y-%m-%dT%H:%M:%SZ)
          sent=$(gh run list -R "$GITHUB_REPOSITORY" -w market_brief.yml \
                   --status success --created ">=$since" --json databaseId \
                   -q '[.[] | select(.databaseId != ${{ github.run_id }})] | length')
          if [ "${sent:-0}" -gt 0 ]; then
            echo "A brief was already sent in the last 90 minutes; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build and send the brief
        if: steps.guard.outputs.skip != 'true'
        run: python market_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional
          PYTHONWARNINGS: ignore   # hide noisy pandas deprecation warnings

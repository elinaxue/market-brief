name: Diagnose data sources

on:
  workflow_dispatch:   # manual only; sends nothing to Telegram

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python market_bot.py --diagnose
        env:
          PYTHONWARNINGS: ignore
